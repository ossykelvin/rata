# Runs Haven's lint, tests, typecheck, and production build.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` installs exactly the committed lockfile. Never `npm install`
      # in CI: it can silently resolve different versions than the developer had.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
